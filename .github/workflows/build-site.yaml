name: build-site
run-name: Build live site

on:
  # called from on-push/on-pages
  workflow_call:

  # run manually by user
  workflow_dispatch:

env:
  PREVIEWS_FOLDER: preview

permissions:
  contents: write

jobs:
  build-site:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch contents
        uses: actions/checkout@v7

      - name: Install Ruby packages
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Get Pages URL
        id: pages
        uses: actions/configure-pages@v6

      - name: Set site URL and base path
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path('_config.yaml')
          lines = path.read_text(encoding='utf-8').splitlines()
          origin = os.environ['PAGES_ORIGIN']
          base_path = os.environ.get('PAGES_BASE_PATH', '')

          new_lines = []
          seen_url = False
          seen_baseurl = False

          for line in lines:
              if line.startswith('url:'):
                  new_lines.append(f'url: "{origin}"')
                  seen_url = True
              elif line.startswith('baseurl:'):
                  new_lines.append(f'baseurl: "{base_path}"')
                  seen_baseurl = True
              else:
                  new_lines.append(line)

          if not seen_url:
              new_lines.append(f'url: "{origin}"')
          if not seen_baseurl:
              new_lines.append(f'baseurl: "{base_path}"')

          path.write_text('\n'.join(new_lines).rstrip() + '\n', encoding='utf-8')
          PY
        env:
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Build live version of site
        run: |
          JEKYLL_ENV=production bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path || '' }}"

      - name: Commit live site to Pages branch
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          folder: _site
          clean-exclude: ${{ env.PREVIEWS_FOLDER }}
          force: false
