name: on-push
run-name: On push to main

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  update-citations:
    uses: ./.github/workflows/update-citations.yaml
    secrets: inherit

  build-site:
    needs: update-citations
    uses: ./.github/workflows/build-site.yaml
