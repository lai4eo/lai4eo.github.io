# THE Research page list. This file is the source of truth: add a DOI here and
# it appears on the page, delete one and it goes. Nothing else is edited.
#
# Each entry needs an `id` that Manubot can resolve (doi:, pmid:, arxiv:, isbn:,
# url:). Any extra field you set here overrides the metadata Manubot fetches —
# that is why the Zenodo entry below carries its own authors, which Manubot
# returns in a less useful order.
#
# AFTER EVERY EDIT:
#
#   ./tools/citations.sh          # regenerates _data/citations.yaml
#   git diff _data/               # review
#                                 # then commit BOTH files
#
# _data/citations.yaml is generated and committed, and the Research page renders
# it, not this file. CI runs tools/check_citations.py and fails the build if the
# two disagree, so forgetting the regen is loud rather than silent.
#
# Do NOT hand-edit _data/citations.yaml. It says so at the top of itself.

