# site properties and page defaults
title: LAI4EO
subtitle: by NASA Harvest and CNR-IREA
description: LAI4EO is a consortium that solicits in-situ LAI measurements from around the world for Earth Observation applications
header: images/background.png
footer: images/background.png
proofer: false

url: "https://lai4eo.github.io"
baseurl: ""

# site social media and other links
links:
  email: lai4eo@umd.edu
  # _data/types.yaml expands this into https://github.com/$VALUE,
  # so this is the bare org name, not a full URL.
  github: lai4eo

### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post

collections:
  # generate page for each member
  members:
    output: true
  # generate page for each post
  posts:
    output: true

# jekyll plugins
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff

